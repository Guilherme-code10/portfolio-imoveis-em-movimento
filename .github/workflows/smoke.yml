name: Verificacao do site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Usar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar scripts, paginas e dados ficticios
        run: node tests/smoke.mjs
